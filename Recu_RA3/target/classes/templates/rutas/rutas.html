<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Rutas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container mt-5">
    <h1 class="mb-4">Gestión de Rutas</h1>

    <div class="mb-3">
        <button class="btn btn-primary" onclick="mostrarModalCrearRuta()">
            ➕ Nueva Ruta
        </button>
        <a href="/control" class="btn btn-secondary">Volver</a>
    </div>

    <div id="datosRutas">
        <div class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
    </div>
</div>

<!-- IMPORTANTE: ruta absoluta al JS en /static/js -->
<script src="/js/rutas.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
